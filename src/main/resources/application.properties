spring.application.name=fortinity-backend


# Puerto del backend
server.port=8080


# Conexion con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fortinity_db?serverTimezone=UTC
spring.datasource.username=fortinity_app
spring.datasource.password=${DB_PASSWORD}


# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false